<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard - Library Management System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="dashboard">
<nav id="nav"></nav>
<main>
  <h1>Dashboard</h1>
  <div class="cards">
    <div class="card"><div class="num" id="totalBooks">0</div><div class="label">Total Books</div></div>
    <div class="card"><div class="num" id="totalMembers">0</div><div class="label">Total Members</div></div>
    <div class="card"><div class="num" id="issuedBooks">0</div><div class="label">Issued Books</div></div>
    <div class="card"><div class="num" id="returnedBooks">0</div><div class="label">Returned Books</div></div>
  </div>
  <p id="msg" class="msg"></p>
</main>
<script src="js/script.js"></script>
</body>
</html>
